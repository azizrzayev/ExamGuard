{% extends "admin_base.html" %}
{% block title %}Panel{% endblock %}

{% block content %}
<style>
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .stat small{color:var(--muted);display:block}
  .stat b{font-size:28px}
</style>

<div class="top"><h1>{{ institution.name }}</h1></div>

<div class="stats">
  <div class="stat"><small>Müəllimlər</small><b>{{ teacher_count }}</b></div>
  <div class="stat"><small>Tələbələr</small><b>{{ student_count }}</b></div>
</div>
{% endblock %}
