{% extends "admin_base.html" %}
{% block title %}Yeni müəllim{% endblock %}

{% block content %}
<div class="top"><h1>Yeni müəllim</h1></div>

<div class="panel" style="max-width:520px">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div style="margin-bottom:14px">
        <label>{{ field.label }}</label>
        {{ field }}
        {% for e in field.errors %}<div class="err">{{ e }}</div>{% endfor %}
      </div>
    {% endfor %}
    <button class="btn" type="submit" onclick="this.form.submit();this.disabled=true;this.textContent='Yaradılır...'">Yarat</button>
    <a class="btn ghost" href="{% url 'admin_dashboard' %}">Ləğv et</a>
  </form>
</div>
{% endblock %}
