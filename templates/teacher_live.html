{% extends 'teacher_base.html' %}
{% block title %}Canlı izləmə{% endblock %}

{% block content %}
<style>
  .feed li.run{border-left-color:#a78bfa}
  .feed li.task{border-left-color:#34d399;background:rgba(52,211,153,.1)}
  .live-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
  @media(max-width:992px){.live-grid{grid-template-columns:1fr}}
  .feed{list-style:none;margin:0;padding:0;max-height:560px;overflow:auto}
  .feed li{padding:10px 12px;margin-bottom:8px;border-radius:10px;background:rgba(255,255,255,.06);
           border-left:4px solid #94a3b8;font-size:14px}
  .feed li.entered{border-left-color:#38bdf8}
  .feed li.warning{border-left-color:#fb923c;background:rgba(251,146,60,.12)}
  .feed li.submitted{border-left-color:#34d399}
  .feed small{display:block;color:#94a3b8}
  .wbadge{display:inline-block;min-width:54px;text-align:center;padding:2px 10px;border-radius:99px;
          background:rgba(255,255,255,.12);font-weight:600}
  .wbadge.mid{background:#92400e;color:#fed7aa}
  .wbadge.high{background:#991b1b;color:#fecaca}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#34d399;margin-right:6px;
       animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.3}}
</style>

<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="fw-bold mb-0"><span class="dot"></span>Canlı izləmə</h4>
  <span class="text-white-50 small" id="updated">Yüklənir...</span>
</div>

<div class="live-grid">
  <div class="glass-panel p-4">
    <h5 class="fw-bold mb-3">Hazırda imtahan verənlər (<span id="activeCount">0</span>)</h5>
    <div class="table-responsive">
      <table class="table table-dark table-borderless align-middle mb-0" style="--bs-table-bg:transparent">
        <thead><tr class="text-white-50 small"><th>Tələbə</th><th>İmtahan</th><th>Xəbərdarlıq</th></tr></thead>
        <tbody id="activeBody"><tr><td colspan="3" class="text-white-50">Yüklənir...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="glass-panel p-4">
    <h5 class="fw-bold mb-3">Bildirişlər</h5>
    <ul class="feed" id="feed"><li>Yüklənir...</li></ul>
  </div>
</div>

<script>
  const FEED_URL = "{% url 'teacher_live_feed' %}";
  let since = '';
  let first = true;

  function timeOf(iso) {
    return new Date(iso).toLocaleTimeString('az-AZ', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function addEvent(e) {
    const feed = document.getElementById('feed');
    if (first) { feed.innerHTML = ''; first = false; }
    const li = document.createElement('li');
    li.className = e.kind;
    const b = document.createElement('b');
    b.textContent = e.student;
    li.appendChild(b);
    li.appendChild(document.createTextNode(' ' + e.detail));
    const sm = document.createElement('small');
    sm.textContent = e.exam + ' · ' + timeOf(e.t);
    li.appendChild(sm);
    feed.insertBefore(li, feed.firstChild);
    while (feed.children.length > 100) feed.removeChild(feed.lastChild);
  }

  function renderActive(list) {
    document.getElementById('activeCount').textContent = list.length;
    const body = document.getElementById('activeBody');
    body.innerHTML = '';
    if (!list.length) {
      body.innerHTML = '<tr><td colspan="3" class="text-white-50">Hazırda imtahan verən yoxdur.</td></tr>';
      return;
    }
    list.forEach(function (a) {
      const tr = document.createElement('tr');
      const td1 = document.createElement('td'); td1.className = 'fw-semibold'; td1.textContent = a.student;
      const td2 = document.createElement('td'); td2.textContent = a.exam;
      const td3 = document.createElement('td');
      const sp = document.createElement('span');
      sp.className = 'wbadge' + (a.warnings >= a.max - 1 && a.warnings > 0 ? ' high' : (a.warnings > 0 ? ' mid' : ''));
      sp.textContent = a.warnings + ' / ' + a.max;
      td3.appendChild(sp);
      tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
      body.appendChild(tr);
    });
  }

  async function poll() {
    try {
      const url = FEED_URL + (since ? '?since=' + encodeURIComponent(since) : '');
      const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
      const data = await resp.json();
      if (data.error) return;
      if (first && !data.events.length) {
        document.getElementById('feed').innerHTML = '<li>Hələ hadisə yoxdur.</li>';
      }
      data.events.forEach(addEvent);
      renderActive(data.active);
      since = data.now;
      document.getElementById('updated').textContent = 'Yeniləndi: ' + timeOf(data.now);
    } catch (e) {
      document.getElementById('updated').textContent = 'Əlaqə kəsildi...';
    }
  }

  poll();
  setInterval(poll, 4000);
</script>
{% endblock %}
