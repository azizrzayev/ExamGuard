{% load static %}
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş — ExamGuard</title>
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            background: #ffffff;
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            background: linear-gradient(45deg, #4e54c8, #8f94fb);
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            color: white;
            padding: 1.5rem;
            text-align: center;
        }
        .btn-gradient {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            color: white;
            font-weight: bold;
        }
        .btn-gradient:hover {
            color: white;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h4 class="fw-bold mb-0">ExamGuard</h4>
            <small>Sistemə daxil olun</small>
        </div>
        <div class="card-body p-4">
            {% if form.errors %}
                <div class="alert alert-danger p-2 small">
                    İstifadəçi adı və ya şifrə yanlışdır.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">İstifadəçi adı:</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Şifrə:</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-gradient w-100 py-2 mt-2">Daxil ol</button>
            </form>
        </div>
    </div>
</body>
</html>
